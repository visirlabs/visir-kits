schemaVersion: "2"
kind: mixin
name: az-cli
description: Installs the Azure CLI (az) and the Azure DevOps extension.

# Stack after the visir kit:
#   sbx run visir <workspace> --kit docker.io/visirlabs/visir:latest \
#     --kit "git+https://github.com/visirlabs/visir-kits.git#dir=az-cli"
setup:
  install:
    # Runs once at creation, as root, and unions with (does not replace) the
    # base kit's steps — docs/kit-architecture.md.
    - description: Install the Azure CLI and the azure-devops extension
      command: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        export AZURE_CORE_COLLECT_TELEMETRY=no
        # The base kit runs apt-get concurrently at creation; DPkg::Lock::Timeout
        # does not cover the `apt-get update` lists lock, so retry past it.
        apt_get() {
          n=0
          while ! apt-get "$@"; do
            n=$((n + 1))
            [ "$n" -ge 120 ] && { echo "apt-get: lock held too long" >&2; return 1; }
            sleep 1
          done
        }
        if ! command -v az >/dev/null 2>&1; then
          # Only the MS repo is added: the base image has curl and
          # ca-certificates, and the azure-cli .deb depends on nothing from apt.
          . /etc/os-release
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            -o /etc/apt/keyrings/microsoft.asc
          printf 'Types: deb\nURIs: https://packages.microsoft.com/repos/azure-cli/\nSuites: %s\nComponents: main\nArchitectures: %s\nSigned-by: /etc/apt/keyrings/microsoft.asc\n' \
            "$VERSION_CODENAME" "$(dpkg --print-architecture)" \
            > /etc/apt/sources.list.d/azure-cli.sources
          apt_get update
          apt_get install --yes azure-cli
        fi
        # Without --system the extension lands under root's HOME, unreadable by
        # the agent user that later runs `az`.
        az extension add --system --name azure-devops --yes --only-show-errors
        # Persist the telemetry opt-out for the agent: the env var above is not
        # inherited by every context that runs `az` (agent-spawned ones aren't),
        # but ~/.azure/config is always read.
        su -s /bin/sh -c 'az config set core.collect_telemetry=no --only-show-errors' agent

permissions:
  network:
    allow:
      # azure-cli apt repo + signing key
      - "packages.microsoft.com:443"
      # `apt-get update` still refreshes the base image's Ubuntu sources
      - "archive.ubuntu.com:80"
      - "security.ubuntu.com:80"
      # azure-devops extension: aka.ms redirects to the index; extension search,
      # the runtime command-index check, and wheel download use three separate
      # MS endpoints (learn.microsoft.com/cli/azure/azure-cli-endpoints); pip
      # then pulls the wheel's `distro` dep from PyPI.
      - "aka.ms:443"
      - "azcliextensionsync.blob.core.windows.net:443"
      - "azurecliextensionsync.blob.core.windows.net:443"
      - "azcliprod.blob.core.windows.net:443"
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      # `az devops`/`repos`/`pipelines`/`boards`/`artifacts` REST calls;
      # interactive `az login` also needs login.microsoftonline.com
      - "dev.azure.com:443"
