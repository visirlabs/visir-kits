schemaVersion: "2"
kind: sandbox
name: visir
description: Runs security checks on the sandbox before granting access
args:
  base:
    default: claude
    description: Built-in agent kit to extend
    enum: [claude, codex, copilot, cursor, devin, docker-agent, droid, gemini, kiro, opencode, shell]
extends: ${{ kit.args.base }}

# Declared sections merge with the extended kit's; the rest is inherited.
# The base's hosts reach the allow list only through that merge, which
# needs sbx v0.42.1 or newer: earlier releases replaced permissions: wholesale.
sandbox:
  entrypoint:
    - /bin/bash
    - -c
    - |
      set -eu
      curl -fsSL https://raw.githubusercontent.com/visirlabs/visir-kits/main/entrypoint.sh -o /tmp/visir-entrypoint.sh
      exec bash /tmp/visir-entrypoint.sh '${{ kit.args.base }}' "$@"
    # Placeholder so sbx run's own trailing args reach the agent.
    - --

permissions:
  network:
    allow:
      # GitHub
      - "api.github.com:443"
      - "github.com:443"
      - "raw.githubusercontent.com:443"
      - "release-assets.githubusercontent.com:443"
      # Ubuntu
      - "archive.ubuntu.com:80"
      - "security.ubuntu.com:80"
      # Docker
      - "download.docker.com:443"
      - "docs.docker.com:443"
      # Npm
      - "registry.npmjs.org:443"
