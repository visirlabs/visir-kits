schemaVersion: "2"
kind: sandbox
name: visir
description: Runs security checks on the sandbox before granting access
extends: claude

# Declared sections merge with the extended kit's; the rest is inherited.
sandbox:
  entrypoint:
    - /bin/bash
    - -c
    - |
      set -eu
      curl -fsSL https://raw.githubusercontent.com/visirlabs/visir-kits/main/entrypoint.sh -o /tmp/visir-entrypoint.sh
      exec bash /tmp/visir-entrypoint.sh

permissions:
  network:
    allow:
      # GitHub
      - "api.github.com:443"
      - "github.com:443"
      - "raw.githubusercontent.com:443"
      - "release-assets.githubusercontent.com:443"
      # Ubuntu
      - "archive.ubuntu.com:80"
      - "security.ubuntu.com:80"
      # Docker
      - "download.docker.com:443"
      - "docs.docker.com:443"
      # Npm
      - "registry.npmjs.org:443"
      # Kit: claude — mirrors the base allow list
      - "api.anthropic.com:443"
      - "platform.claude.com:443"
      - "downloads.claude.ai:443"
      - "claude.com:443"
      - "mcp-proxy.anthropic.com:443"
      - "bridge.claudeusercontent.com:443"
